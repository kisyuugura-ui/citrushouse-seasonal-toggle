name: 季節メニュー点検

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      test_date:
        description: "テスト用の日付 YYYY-MM-DD（空欄なら本日）"
        required: false
        type: string
        default: ""
      skip_stripe:
        description: "Stripeに触れず通知だけ試す（テスト用）"
        required: false
        type: choice
        options: ["off", "on"]
        default: "off"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 季節メニューを点検
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DATE: ${{ github.event.inputs.test_date }}
          SKIP_STRIPE: ${{ github.event.inputs.skip_stripe == 'on' && '1' || '' }}
        run: python toggle.py
