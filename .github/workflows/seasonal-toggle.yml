name: 季節メニュー自動切替

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch: {}

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 決済リンクの有効/無効を判定・更新
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: python toggle.py
